          python - "$RUNNER_TEMP/madar-models.json" "$GITHUB_WORKSPACE" <<'MADAR_PY'
          """Restore the original public model binaries. Usage: python restore.py assets.json REPOSITORY_ROOT"""
          import hashlib
          import json
          import os
          from pathlib import Path
          import sys
          import tempfile
          import time
          import urllib.request
          from concurrent.futures import ThreadPoolExecutor

          manifest = json.loads(Path(sys.argv[1]).read_text())
          root = Path(sys.argv[2]).resolve()

          def digest(data):
              return hashlib.sha256(data).hexdigest()

          def restore(item):
              def local(part):
                  target = (root / part['path']).resolve()
                  target.relative_to(root)
                  return target

              def verified(part):
                  path = local(part)
                  return path.is_file() and path.stat().st_size == part['bytes'] and digest(path.read_bytes()) == part['sha256']

              if all(verified(part) for part in item['outputs']):
                  return
              for attempt in range(3):
                  try:
                      request = urllib.request.Request(item['url'], headers={'User-Agent':'Madar static model restore/1'})
                      with urllib.request.urlopen(request, timeout=120) as response:
                          data = response.read(item['bytes'] + 1)
                      if len(data) != item['bytes'] or digest(data) != item['sha256']:
                          raise ValueError('Source hash or length mismatch')
                      break
                  except (OSError, ValueError) as error:
                      if attempt == 2:
                          raise RuntimeError('Failed to restore ' + item['url']) from error
                      time.sleep(2 ** attempt)
              for part in item['outputs']:
                  block = data[part['start']:part['start'] + part['bytes']]
                  if len(block) != part['bytes'] or digest(block) != part['sha256']:
                      raise ValueError('Output hash or length mismatch: ' + part['path'])
                  target = local(part)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with tempfile.NamedTemporaryFile(dir=target.parent,delete=False) as temp:
                      temp.write(block)
                  os.replace(temp.name,target)
              print('Restored', item['url'].rsplit('/',1)[-1], flush=True)

          with ThreadPoolExecutor(max_workers=4) as pool:
              list(pool.map(restore, manifest))

          MADAR_PY
          git add -- docs/assets
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Import checksum-verified speech models for Madar'
            git push origin HEAD:main
          fi
